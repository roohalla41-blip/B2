name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v6

      - name: تنظیم Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: آماده‌سازی keystore امضا
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 -d > app/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: تنظیم نسخه APK
        run: |
          sed -i 's/versionCode [0-9]*/versionCode 1/' app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.0.1"/' app/build.gradle

          echo "versionCode = 1"
          echo "versionName = 1.0.1"

      - name: بررسی و آماده‌سازی آیکون برنامه
        run: |
          if [ ! -f icon.png ]; then
            echo "خطا: فایل icon.png در ریشه پروژه پیدا نشد."
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y imagemagick

          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          convert icon.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert icon.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert icon.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          convert icon.png -resize 432x432 app/src/main/res/drawable/ic_launcher_foreground.png

          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#FFFFFF</color></resources>' > app/src/main/res/values/icon_colors.xml

          echo '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background" /><foreground android:drawable="@drawable/ic_launcher_foreground" /></adaptive-icon>' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: تنظیم آیکون لانچر
        run: |
          if [ -f app/src/main/AndroidManifest.xml ]; then
            sed -i 's#android:icon="@[^"]*"#android:icon="@mipmap/ic_launcher"#g' app/src/main/AndroidManifest.xml
            sed -i 's#android:roundIcon="@[^"]*"#android:roundIcon="@mipmap/ic_launcher"#g' app/src/main/AndroidManifest.xml
          else
            echo "هشدار: AndroidManifest.xml پیدا نشد."
          fi

      - name: ساخت APK امضاشده
        run: gradle assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: تغییر نام APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "خطا: فایل APK پیدا نشد."
            exit 1
          fi

          cp "$APK_FILE" "app/build/outputs/apk/release/Hesab-Sarraf-1.0.1.apk"

          echo "APK آماده شد:"
          ls -lh app/build/outputs/apk/release/Hesab-Sarraf-1.0.1.apk

      - name: بررسی فایل APK
        run: |
          find app/build/outputs/apk/release -type f -name "*.apk" -print

      - name: آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: Hesab-Sarraf-1.0.1
          path: app/build/outputs/apk/release/Hesab-Sarraf-1.0.1.apk
          if-no-files-found: error
