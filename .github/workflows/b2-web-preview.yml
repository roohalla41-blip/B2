name: B2 Isolated Preview Build

on:
  workflow_dispatch:
  push:
    branches:
      - fix/isolate-b2-auth-and-pages-routing
    paths:
      - '**'
      - '.github/workflows/b2-web-preview.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: b2-isolated-preview-build
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated B2 preview branch
        uses: actions/checkout@v4
        with:
          ref: fix/isolate-b2-auth-and-pages-routing

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build isolated B2 preview
        run: npm run build

      - name: Upload preview build artifact
        uses: actions/upload-artifact@v4
        with:
          name: b2-isolated-preview-dist
          path: ./dist
          if-no-files-found: error
          retention-days: 7
