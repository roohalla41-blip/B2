name: Copy A1 source into B2 review branch

on:
  push:
    branches:
      - backup/a1-copy-review

permissions:
  contents: write

jobs:
  copy-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout B2 review branch
        uses: actions/checkout@v4
        with:
          ref: backup/a1-copy-review

      - name: Checkout A1 application source
        uses: actions/checkout@v4
        with:
          repository: roohalla41-blip/-1
          ref: release/restore-build
          path: a1-source
          persist-credentials: false

      - name: Copy A1 files while preserving B2 APK signing files
        run: |
          rsync -a --exclude='.git' --exclude='README.md' --exclude='.github/workflows/' a1-source/ ./
          rm -rf a1-source
          git status --short

      - name: Commit copied source to B2 review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes detected."
            exit 0
          fi
          git commit -m "Copy complete A1 source into B2 review branch"
          git push origin HEAD:backup/a1-copy-review

      - name: Install web dependencies and build A1 app
        run: |
          npm ci
          npm run build

      - name: Upload built web app for review
        uses: actions/upload-artifact@v4
        with:
          name: B2-A1-copy-web-build
          path: dist/
          if-no-files-found: error
