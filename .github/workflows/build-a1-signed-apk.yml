name: Build signed APK from copied A1 source

on:
  push:
    branches:
      - backup/a1-copy-review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout B2 review branch
        uses: actions/checkout@v4
        with:
          ref: backup/a1-copy-review

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install web dependencies and build A1
        run: |
          npm install
          npm run build

      - name: Install Capacitor Android tooling
        run: npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Configure Capacitor for the existing B2 app identity
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.base44.apk",
            "appName": "حساب صراف",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Prepare the existing APK signing key
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "KEYSTORE_BASE64 secret is missing." && exit 1)
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > android/release.keystore
          test -s android/release.keystore || (echo "Signing keystore could not be decoded." && exit 1)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Configure release signing without changing the app ID
        run: |
          test -n "$KEYSTORE_PASSWORD" || (echo "KEYSTORE_PASSWORD secret is missing." && exit 1)
          test -n "$KEY_ALIAS" || (echo "KEY_ALIAS secret is missing." && exit 1)
          test -n "$KEY_PASSWORD" || (echo "KEY_PASSWORD secret is missing." && exit 1)
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          s, n = re.subn(r'applicationId\\s+["\\'][^"\\']+["\\']', 'applicationId "com.base44.apk"', s, count=1)
          if n != 1:
              raise SystemExit("Could not locate applicationId in generated Android Gradle file.")
          s = re.sub(r'versionName\\s+["\\'][^"\\']+["\\']', 'versionName "1.0.1"', s, count=1)

          release_block = """release {
                  storeFile file("\\${rootProject.projectDir}/release.keystore")
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }"""

          # Find signingConfigs and its matching closing brace, respecting nested braces.
          match = re.search(r'\\bsigningConfigs\\s*\\{', s)
          if match:
              open_brace = s.find("{", match.start())
              depth = 0
              close_brace = None
              for i in range(open_brace, len(s)):
                  if s[i] == "{":
                      depth += 1
                  elif s[i] == "}":
                      depth -= 1
                      if depth == 0:
                          close_brace = i
                          break
              if close_brace is None:
                  raise SystemExit("Could not parse signingConfigs block.")
              body = s[open_brace + 1:close_brace]
              existing = re.search(r'\\brelease\\s*\\{', body)
              if existing:
                  rel_open = open_brace + 1 + body.find("{", existing.start())
                  depth = 0
                  rel_close = None
                  for i in range(rel_open, close_brace):
                      if s[i] == "{":
                          depth += 1
                      elif s[i] == "}":
                          depth -= 1
                          if depth == 0:
                              rel_close = i
                              break
                  if rel_close is None:
                      raise SystemExit("Could not parse existing release signing block.")
                  s = s[:rel_open] + "{\\n              " + release_block + "\\n          " + s[rel_close + 1:]
              else:
                  s = s[:close_brace] + "\\n          " + release_block + "\\n      " + s[close_brace:]
          else:
              build_types = re.search(r'(?m)^\\s*buildTypes\\s*\\{', s)
              if not build_types:
                  raise SystemExit("Could not locate buildTypes block.")
              indent = re.match(r'\\s*', build_types.group(0)).group(0)
              block = indent + "signingConfigs {\\n          " + release_block + "\\n      }\\n\\n"
              s = s[:build_types.start()] + block + s[build_types.start():]

          # Ensure release build type explicitly uses the release signing config.
          bt = re.search(r'(?m)^\\s*buildTypes\\s*\\{', s)
          if not bt:
              raise SystemExit("Could not locate buildTypes block.")
          rel = re.search(r'(?m)^\\s*release\\s*\\{', s[bt.end():])
          if not rel:
              raise SystemExit("Could not locate release build type.")
          rel_start = bt.end() + rel.start()
          rel_open = s.find("{", rel_start)
          depth = 0
          rel_close = None
          for i in range(rel_open, len(s)):
              if s[i] == "{":
                  depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      rel_close = i
                      break
          if rel_close is None:
              raise SystemExit("Could not parse release build type.")
          release_body = s[rel_open + 1:rel_close]
          release_body = re.sub(r'(?m)^\\s*signingConfig\\s+signingConfigs\\.release\\s*\\n?', '', release_body)
          release_body = "\\n            signingConfig signingConfigs.release" + release_body
          s = s[:rel_open + 1] + release_body + s[rel_close:]

          p.write_text(s)
          PY
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Keep Capacitor default launcher resources for this review build
        run: test -d android/app/src/main/res

      - name: Build signed release APK
        run: cd android && ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          test -n "$APK_FILE" || (echo "Release APK was not produced." && exit 1)
          cp "$APK_FILE" "B2-Hesab-Sarraf-A1-1.0.1.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: B2-Hesab-Sarraf-A1-Signed-APK
          path: B2-Hesab-Sarraf-A1-1.0.1.apk
          if-no-files-found: error
