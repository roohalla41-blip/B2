<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>در حال بازگشت به حساب صراف…</title>
  </head>
  <body>
    <p>در حال بازگشت به حساب صراف…</p>
    <script>
      var path = window.location.pathname;
      var isProjectPages = window.location.hostname.endsWith('github.io') &&
        (path === '/B2' || path.indexOf('/B2/') === 0);
      var base = isProjectPages ? '/B2/' : '/';
      var requestedPath = path + window.location.search + window.location.hash;
      window.location.replace(base + '?__spa_path=' + encodeURIComponent(requestedPath));
    </script>
  </body>
</html>
